# ===== 告警规则 =====
groups:
  - name: a2ui-agent
    rules:
      - alert: HighErrorRate
        expr: rate(agent_requests_total{status="error"}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Agent 请求错误率过高"
          description: "过去 5 分钟 Agent 请求错误率 {{ $value }}"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(agent_request_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agent 请求延迟过高"
          description: "P95 延迟 {{ $value }}s"

      - alert: A2UIValidationErrorSpike
        expr: rate(a2ui_validation_errors_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A2UI 校验错误增加"
          description: "过去 5 分钟校验错误率 {{ $value }}"

      - alert: SSEConnectionLeak
        expr: sse_connections_active > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SSE 连接数异常"
          description: "当前活跃 SSE 连接数 {{ $value }}"
